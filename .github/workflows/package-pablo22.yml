name: Package Pablo22

on:
  push:
    branches: ["Pablo22"]
  pull_request:
    branches: ["main"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          zip -r ParkSmart-Cloud-Pablo22.zip . -x '.git/*' '.github/workflows/package-pablo22.yml'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkSmart-Cloud-Pablo22
          path: ParkSmart-Cloud-Pablo22.zip
          retention-days: 7
