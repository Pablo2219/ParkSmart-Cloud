name: Integracion continua

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "test/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Python y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: "ci-secret-key-no-productiva"
      JWT_SECRET: "ci-jwt-secret-no-productiva"
      CORS_ORIGINS: "http://localhost:5500"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verificar sintaxis
        run: python -m compileall -q app migrations tests

      - name: Ejecutar pruebas
        run: python -m pytest --cov=app --cov-report=term-missing

  docker:
    name: Docker, MySQL y migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear .env efimero para CI
        shell: bash
        run: |
          APP_PASSWORD="$(openssl rand -hex 24)"
          MIGRATION_PASSWORD="$(openssl rand -hex 24)"
          ROOT_PASSWORD="$(openssl rand -hex 24)"
          SECRET_KEY="$(openssl rand -hex 32)"
          JWT_SECRET="$(openssl rand -hex 32)"
          cat > .env <<EOF_ENV
          ENVIRONMENT=ci
          DATABASE_URL=mysql+pymysql://parksmart_app:${APP_PASSWORD}@db:3306/parksmart
          MIGRATION_DATABASE_URL=mysql+pymysql://parksmart_migrator:${MIGRATION_PASSWORD}@db:3306/parksmart
          MYSQL_DATABASE=parksmart
          MYSQL_USER=parksmart_app
          MYSQL_PASSWORD=${APP_PASSWORD}
          MYSQL_MIGRATION_USER=parksmart_migrator
          MYSQL_MIGRATION_PASSWORD=${MIGRATION_PASSWORD}
          MYSQL_ROOT_PASSWORD=${ROOT_PASSWORD}
          SECRET_KEY=${SECRET_KEY}
          JWT_SECRET=${JWT_SECRET}
          JWT_ALGORITHM=HS256
          CORS_ORIGINS=http://localhost:5500
          EOF_ENV

      - name: Validar Compose
        run: docker compose config --quiet

      - name: Levantar entorno desde cero
        run: docker compose up -d --build --wait

      - name: Verificar servicios y API
        run: |
          docker compose ps -a
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/health
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/health/ready

      - name: Verificar revision Alembic
        run: docker compose run --rm --no-deps -T migrate python -m alembic current

      - name: Mostrar diagnostico si falla
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Limpiar entorno
        if: always()
        run: docker compose down -v --remove-orphans

  terraform:
    name: Terraform estatico
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  seguridad:
    name: Verificacion basica de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Impedir archivos sensibles conocidos
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|terraform\.tfvars)$|\.(pem|key|pfx|p12)$'; then
            echo "Se detectaron archivos sensibles rastreados por Git."
            exit 1
          fi
